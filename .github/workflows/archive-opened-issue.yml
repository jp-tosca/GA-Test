name: Archive opened issue

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Create Markdown snapshot
        run: python .github/scripts/archive_issue.py "$GITHUB_EVENT_PATH"

      - name: Commit and push snapshot
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "issues/issue-${ISSUE_NUMBER}.md"
          if git diff --cached --quiet; then
            echo "Issue snapshot is already up to date."
            exit 0
          fi
          git commit -m "Archive issue #${ISSUE_NUMBER}"
          for attempt in 1 2 3; do
            git pull --rebase origin "${DEFAULT_BRANCH}"
            if git push origin "HEAD:${DEFAULT_BRANCH}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying after updating the branch."
          done
          exit 1
