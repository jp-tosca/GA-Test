name: Claude issue triage

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      mode:
        description: Analysis to run
        required: true
        default: full
        type: choice
        options:
          - full
          - duplicates
          - estimate
      issue_number:
        description: Existing issue number (optional when a title is provided)
        required: false
        type: string
      title:
        description: Proposed title when no issue number is supplied
        required: false
        type: string
      requirement:
        description: Proposed requirement when no issue number is supplied
        required: false
        type: string

permissions: {}

jobs:
  archive:
    if: ${{ github.event_name == 'issues' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: read

    steps:
      - name: Check out the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Create Markdown snapshot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-haiku-4-5' }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_COMMENT_PATH: ${{ runner.temp }}/issue-comment.md
        run: python .github/scripts/archive_issue.py "$GITHUB_EVENT_PATH"

      - name: Commit and push snapshot
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "issues/issue-${ISSUE_NUMBER}.md"
          if git diff --cached --quiet; then
            echo "Issue snapshot is already up to date."
            exit 0
          fi
          git commit -m "Archive issue #${ISSUE_NUMBER}"
          for attempt in 1 2 3; do
            git pull --rebase origin "${DEFAULT_BRANCH}"
            if git push origin "HEAD:${DEFAULT_BRANCH}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying after updating the branch."
          done
          exit 1

      - name: Reply to the issue
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_COMMENT_PATH: ${{ runner.temp }}/issue-comment.md
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [[ -f "$ISSUE_COMMENT_PATH" ]]; then
            python .github/scripts/post_issue_comment.py "$ISSUE_COMMENT_PATH"
          else
            echo "No issue assessment was generated; skipping the reply."
          fi

  manual-triage:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read

    steps:
      - name: Check out the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run selected Claude skills
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-haiku-4-5' }}
          GITHUB_TOKEN: ${{ github.token }}
          TRIAGE_MODE: ${{ inputs.mode }}
          TRIAGE_ISSUE_NUMBER: ${{ inputs.issue_number }}
          TRIAGE_TITLE: ${{ inputs.title }}
          TRIAGE_REQUIREMENT: ${{ inputs.requirement }}
        run: python .github/scripts/manual_triage.py
